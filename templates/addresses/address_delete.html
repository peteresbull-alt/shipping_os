{% extends 'base.html' %}

{% block page_description %}This action cannot be undone{% endblock %}

{% block content %}
<div class="max-w-md">
  <div class="glass rounded-2xl p-8 text-center">
    <div class="w-16 h-16 rounded-2xl bg-red-500/10 flex items-center justify-center mx-auto mb-5"><i class="fas fa-trash text-red-400 text-xl"></i></div>
    <h3 class="text-lg font-bold text-white mb-2">Delete "{{ address.label }}"?</h3>
    <p class="text-sm text-white/40 mb-6">This will permanently remove this saved address. Shipments already booked with it are not affected.</p>
    <form method="post" class="flex items-center gap-3 justify-center">
      {% csrf_token %}
      <a href="{% url 'address_list' %}" class="px-5 py-2.5 text-sm font-semibold rounded-xl text-white/60 border border-white/10 hover:bg-white/5 transition-all">Cancel</a>
      <button type="submit" class="px-5 py-2.5 text-sm font-bold rounded-xl text-white bg-red-500/90 hover:bg-red-500 transition-all">Delete Address</button>
    </form>
  </div>
</div>
{% endblock %}
